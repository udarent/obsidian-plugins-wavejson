name: Release

# Pushing a tag (e.g. 0.1.0) publishes a release: verify the three version files agree,
# syntax-check main.js, then upload manifest.json / main.js / styles.css as assets.
#
# This workflow does NOT rebuild: main.js is a committed artifact and the build needs the
# TimingBench core in a sibling directory, which CI does not have. To ship a release that
# matches a newer core, run `npm run build` locally, commit main.js, and only then tag —
# the version check below catches "tag says 0.2.0 but manifest still says 0.1.0".

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Check version consistency
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME;
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            const bad = [];
            if (manifest.version !== tag) bad.push(`manifest.json ${manifest.version} != tag ${tag}`);
            if (pkg.version !== tag) bad.push(`package.json ${pkg.version} != tag ${tag}`);
            if (!versions[tag]) bad.push(`versions.json has no entry for ${tag}`);
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
            console.log(`Versions agree: ${tag} (minAppVersion ${manifest.minAppVersion})`);
          '

      - name: Check that main.js parses
        run: node --check main.js

      - name: Collect release files
        run: |
          mkdir -p dist
          cp main.js manifest.json styles.css dist/
          ls -l dist

      - name: Generate release notes from CHANGELOG
        run: node release-notes.mjs

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: NOTES.md
